<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirmá tu email</title>
  <style>
    body { margin: 0; padding: 0; background: #f5f5f0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .wrapper { max-width: 600px; margin: 0 auto; padding: 40px 20px; }
    .card { background: #ffffff; border-radius: 16px; padding: 48px 40px; text-align: center; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
    .logo { font-size: 28px; font-weight: 700; color: #1a1a2e; letter-spacing: -0.5px; margin-bottom: 40px; }
    .logo span { color: #6c5ce7; }
    .icon { font-size: 64px; margin-bottom: 24px; }
    h1 { font-size: 24px; font-weight: 700; color: #1a1a2e; margin: 0 0 12px; }
    p { font-size: 16px; line-height: 1.6; color: #4a4a68; margin: 0 0 24px; }
    .btn { display: inline-block; background: #6c5ce7; color: #ffffff; text-decoration: none; padding: 16px 40px; border-radius: 10px; font-size: 16px; font-weight: 600; }
    .note { font-size: 13px; color: #9090a8; margin-top: 24px; }
    .footer { text-align: center; margin-top: 32px; font-size: 13px; color: #9090a8; }
    .footer a { color: #6c5ce7; text-decoration: none; }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="card">
      <div class="logo">Y<span>leis</span></div>
      <div class="icon">✉️</div>
      <h1>Confirmá tu email</h1>
      <p>Hacé clic en el botón de abajo para verificar tu dirección de email y activar tu cuenta.</p>
      <a href="{{ .ConfirmationURL }}" class="btn">Confirmar email</a>
      <p class="note">Este link vence en 24 horas. Si no creaste una cuenta en Yleis, podés ignorar este email.</p>
    </div>
    <div class="footer">
      <p>© 2025 Yleis — <a href="https://yleis.co">yleis.co</a></p>
    </div>
  </div>
</body>
</html>
