<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>¿Cómo estuvo tu clase?</title>
  <style>
    body { margin: 0; padding: 0; background: #f5f5f0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .wrapper { max-width: 600px; margin: 0 auto; padding: 40px 20px; }
    .card { background: #ffffff; border-radius: 16px; padding: 48px 40px; text-align: center; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
    .logo { font-size: 28px; font-weight: 700; color: #1a1a2e; margin-bottom: 32px; }
    .logo span { color: #6c5ce7; }
    .stars { font-size: 48px; margin-bottom: 16px; letter-spacing: 4px; }
    h1 { font-size: 22px; font-weight: 700; color: #1a1a2e; margin: 0 0 12px; }
    p { font-size: 16px; line-height: 1.6; color: #4a4a68; margin: 0 0 16px; }
    .class-info { background: #f8f8fc; border-radius: 12px; padding: 16px 20px; margin: 20px 0; text-align: left; font-size: 15px; color: #4a4a68; }
    .class-info strong { color: #1a1a2e; }
    .btn { display: inline-block; background: #6c5ce7; color: #ffffff; text-decoration: none; padding: 16px 40px; border-radius: 10px; font-size: 16px; font-weight: 600; margin: 20px 0 8px; }
    .note { font-size: 13px; color: #9090a8; }
    .footer { text-align: center; margin-top: 32px; font-size: 13px; color: #9090a8; }
    .footer a { color: #6c5ce7; text-decoration: none; }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="card">
      <div class="logo">Y<span>leis</span></div>
      <div class="stars">⭐⭐⭐⭐⭐</div>
      <h1>¿Cómo estuvo tu clase?</h1>
      <p>Hola {{student_name}}, tu clase con <strong>{{teacher_name}}</strong> terminó. Tu opinión ayuda a otros alumnos a elegir bien.</p>

      <div class="class-info">
        👨‍🏫 <strong>{{teacher_name}}</strong> · {{subject_name}}
      </div>

      <a href="{{review_url}}" class="btn">Dejar mi reseña →</a>
      <p class="note">Solo toma 1 minuto. ¡Gracias por contribuir a la comunidad!</p>
    </div>
    <div class="footer">
      <p>© 2025 Yleis — <a href="https://yleis.co">yleis.co</a></p>
    </div>
  </div>
</body>
</html>
